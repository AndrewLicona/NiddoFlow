# Docker Compose for NiddoFlow

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      network: host
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=https://niddoflow.miserverlab.xyz/api
        - NEXT_PUBLIC_BASE_URL=https://niddoflow.miserverlab.xyz
    container_name: niddoflow-frontend
    restart: unless-stopped
    # Use host network to bypass UFW/Docker bridge blocking DNS resolution.
    # Port 3030 chosen because 3000 is occupied by another service on this host.
    network_mode: host
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=https://niddoflow.miserverlab.xyz/api
      - NEXT_PUBLIC_BASE_URL=https://niddoflow.miserverlab.xyz
      - INTERNAL_API_URL=http://localhost:8100
      - PORT=3030
      - HOSTNAME=0.0.0.0
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: niddoflow-backend
    restart: unless-stopped
    # Backend also uses host network because it needs to reach Supabase directly
    # for JWT verification, OCR (Gemini API), and Prisma queries.
    # Port 8100 chosen because 8000 is occupied by dashboard-youtube_backend on this host.
    network_mode: host
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PORT=8100
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - CORS_ORIGINS=https://niddoflow.miserverlab.xyz
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OCR_PROVIDER=gemini
      - DATABASE_URL=${DATABASE_URL}
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8100/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: niddoflow-nginx
    restart: unless-stopped
    ports:
      - "3100:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Nginx stays on bridge network and reaches the host-networked services
    # via host.docker.internal (mapped to the host gateway IP).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - niddoflow-network
    depends_on:
      - frontend
      - backend

networks:
  niddoflow-network:
    driver: bridge