# Docker Compose for NiddoFlow

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=https://niddoflow.andrewlamaquina.my/api
        - NEXT_PUBLIC_BASE_URL=https://niddoflow.andrewlamaquina.my
    container_name: niddoflow-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=https://niddoflow.andrewlamaquina.my/api
      - NEXT_PUBLIC_BASE_URL=https://niddoflow.andrewlamaquina.my

    networks:
      - niddoflow-network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: niddoflow-backend
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - CORS_ORIGINS=https://niddoflow.andrewlamaquina.my
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OCR_PROVIDER=gemini
    networks:
      - niddoflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: niddoflow-nginx
    restart: unless-stopped
    ports:
      - "3100:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - niddoflow-network
    depends_on:
      - frontend
      - backend

networks:
  niddoflow-network:
    driver: bridge
