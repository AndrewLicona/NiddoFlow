# Docker Compose for NiddoFlow

# ─────────────────────────────────────────────────────────────
# DNS explicito para los containers
#
# Por defecto Docker usa el resolver embebido (127.0.0.11) y lo
# encamina hacia los nameservers del HOST (/etc/resolv.conf). Si el
# host usa systemd-resolved (nameserver 127.0.0.53), Docker lo
# sustituye por la IP del gateway del bridge, donde NADIE escucha
# -> los containers no resuelven nada y Supabase es inalcanzable:
#
#     getaddrinfo EAI_AGAIN rwpfhoykljsylesxxesh.supabase.co
#     [Errno -3] Temporary failure in name resolution
#
# Fijar `dns:` hace que el resolver embebido reenvie SIEMPRE a
# resolvers publicos alcanzables. Los nombres de servicio
# (frontend, backend) los sigue resolviendo el DNS embebido.
# ─────────────────────────────────────────────────────────────
x-dns-resolvers: &dns-resolvers
  dns:
    - 1.1.1.1
    - 8.8.8.8
  dns_opt:
    - timeout:2
    - attempts:3

services:
  frontend:
    <<: *dns-resolvers
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
    container_name: niddoflow-frontend
    restart: unless-stopped
    ports:
      - "3030:3030"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      - INTERNAL_API_URL=http://backend:8100
      - PORT=3030
      - HOSTNAME=0.0.0.0
    networks:
      - niddoflow-network
    depends_on:
      - backend

  backend:
    <<: *dns-resolvers
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: niddoflow-backend
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - PORT=8100
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OCR_PROVIDER=${OCR_PROVIDER:-gemini}
      - DATABASE_URL=${DATABASE_URL}
    networks:
      - niddoflow-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8100/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    <<: *dns-resolvers
    image: nginx:alpine
    container_name: niddoflow-nginx
    restart: unless-stopped
    ports:
      - "3100:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - niddoflow-network
    depends_on:
      - frontend
      - backend

networks:
  niddoflow-network:
    driver: bridge
