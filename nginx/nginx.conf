events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Necesario para cookies grandes de Supabase
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2 application/font-woff;

    # Performance optimizations
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Upstreams Docker
    # Frontend and backend run on host network (network_mode: host) to bypass
    # UFW/Docker bridge issues. Use the bridge gateway IP (172.18.0.1) directly
    # because host.docker.internal maps to the default bridge gateway (172.17.0.1),
    # which is unreachable from containers on the niddoflow-network bridge.
    upstream frontend {
        server 172.18.0.1:3030;
        keepalive 32;
    }

    upstream backend {
        server 172.18.0.1:8100;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10M;

        # =========================
        # FRONTEND (Next.js)
        # =========================
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            # WebSockets / HMR
            proxy_set_header Upgrade $http_upgrade;
            proxy_cache_bypass $http_upgrade;

            # Aggressive timeouts for faster fail-over
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffer reuse for keep-alive connections
            proxy_buffering on;
            keepalive_timeout 65;
        }

        # Static assets caching
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # =========================
        # BACKEND API (FastAPI)
        # =========================
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            # CORS (solo si FastAPI no lo maneja)
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # =========================
        # HEALTHCHECK
        # =========================
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }
    }
}
